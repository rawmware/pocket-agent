<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket Agent</title>
<style>
:root { --bg:#0b0e14; --panel:#12161f; --text:#e8ecf4; --muted:#8b93a7; --bubble:#1a2130; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
  display:flex; flex-direction:column; height:100dvh; }
header { padding:12px 16px; background:var(--panel); display:flex; align-items:center;
  gap:10px; border-bottom:1px solid #1e2534; }
header h1 { font-size:16px; margin:0; flex:1; }
select, button { background:#1a2130; color:var(--text); border:1px solid #2a3448;
  border-radius:10px; padding:8px 10px; font-size:14px; }
#spend { font-size:12px; color:var(--muted); white-space:nowrap; }
#msgs { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
.msg { max-width:85%; padding:10px 14px; border-radius:16px; line-height:1.45;
  font-size:15px; white-space:pre-wrap; word-wrap:break-word; }
.user { align-self:flex-end; background:#1f6feb; }
.agent { align-self:flex-start; background:var(--bubble); }
.msg pre { background:#0b0e14; padding:10px; border-radius:10px; overflow-x:auto; font-size:13px; }
.msg code { font-family:ui-monospace,Menlo,monospace; }
.tool { align-self:flex-start; font-size:12px; color:var(--muted); background:#141a26;
  border:1px dashed #2a3448; padding:6px 10px; border-radius:10px; }
.typing { color:var(--muted); font-size:13px; align-self:flex-start; }
#composer { display:flex; gap:8px; padding:12px; background:var(--panel);
  border-top:1px solid #1e2534; padding-bottom:calc(12px + env(safe-area-inset-bottom)); }
#input { flex:1; background:#1a2130; border:1px solid #2a3448; border-radius:12px;
  color:var(--text); padding:10px 12px; font-size:15px; resize:none; font-family:inherit; }
#send { background:#1f6feb; border:none; font-weight:600; }
.costline { font-size:11px; color:var(--muted); margin-top:8px; }
</style>
</head>
<body>
<header>
  <h1>&#129302; Pocket Agent</h1>
  <span id="spend"></span>
  <select id="model"><option value="">default</option><option value="smart">smart</option></select>
  <button id="clear">New</button>
</header>
<div id="msgs"></div>
<div id="composer">
  <textarea id="input" rows="1" placeholder="Ask anything&hellip;"></textarea>
  <button id="send">Send</button>
</div>
<script>
const msgs = document.getElementById('msgs');
const input = document.getElementById('input');
let sessionId = localStorage.getItem('pa_session') || '';

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function md(s){
  s = esc(s);
  s = s.replace(/```(\w*)\n([\s\S]*?)```/g, function(m,l,c){
    return '<pre><code>' + c.replace(/\n$/,'') + '</code></pre>'; });
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  return s;
}
function add(role, html){
  const d = document.createElement('div');
  d.className = 'msg ' + (role === 'user' ? 'user' : 'agent');
  d.innerHTML = html;
  msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight;
  return d;
}
function short(m){ m = m || ''; const p = m.split('/'); return p[p.length-1].slice(0, 18); }
async function loadModels(){
  try {
    const r = await fetch('/api/models');
    const models = await r.json();
    document.getElementById('spend').textContent = '$' + Number(models.daily_budget_usd).toFixed(2) + '/day cap';
    const sel = document.getElementById('model');
    sel.options[0].text = '\u26A1 ' + short(models.default);
    sel.options[1].text = '\uD83E\uDDE0 ' + short(models.smart);
    sel.options[1].value = models.smart;
  } catch(e) { /* server not up yet */ }
}
async function send(){
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  add('user', md(text));
  const typing = document.createElement('div');
  typing.className = 'typing'; typing.textContent = 'thinking\u2026';
  msgs.appendChild(typing); msgs.scrollTop = msgs.scrollHeight;
  const modelSel = document.getElementById('model').value;
  try {
    const res = await fetch('/api/chat', { method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ message:text,
        session_id: sessionId || undefined, model: modelSel || undefined }) });
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream:true });
      let idx;
      while ((idx = buf.indexOf('\n\n')) >= 0) {
        const chunk = buf.slice(0, idx); buf = buf.slice(idx + 2);
        for (const line of chunk.split('\n')) {
          if (!line.startsWith('data: ')) continue;
          const evt = JSON.parse(line.slice(6));
          if (evt.type === 'tool') {
            const t = document.createElement('div');
            t.className = 'tool'; t.textContent = '\uD83D\uDD27 ' + evt.name;
            msgs.insertBefore(t, typing);
          } else if (evt.type === 'done') {
            typing.remove();
            if (evt.error) { add('agent', '\u26A0\uFE0F ' + esc(evt.error)); }
            else {
              sessionId = evt.session_id;
              localStorage.setItem('pa_session', sessionId);
              let extra = '';
              if (evt.cost_usd != null) {
                extra = '<div class="costline">~$' + Number(evt.cost_usd).toFixed(4) +
                  ' this reply &middot; $' + Number(evt.spent_today || 0).toFixed(2) + ' today</div>';
              }
              add('agent', md(evt.reply || '(no reply)') + extra);
            }
          }
        }
      }
    }
  } catch(e) { typing.remove(); add('agent', '\u26A0\uFE0F network error: ' + esc(String(e))); }
  msgs.scrollTop = msgs.scrollHeight;
}
document.getElementById('send').onclick = send;
input.addEventListener('keydown', function(e){
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
document.getElementById('clear').onclick = function(){
  sessionId = ''; localStorage.removeItem('pa_session'); msgs.innerHTML = '';
};
loadModels();
</script>
</body>
</html>
